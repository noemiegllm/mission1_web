<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <title>Mystery number</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="app.css">
    <link rel="shortcut icon" href="faviconGame.png">
    <script src="app.js" defer></script>
  </head>

  <body>

    <article>
        <h1>"Guess the number" game</h1>
        <p>You have to guess the secret number by proposing numbers (1-100). The bot will answer by higher, lower or correct.</p>
    </article>
    <article>
        <h2 id="oracleAnswer">?</h2>
        <input placeholder="Enter your guess" id="inputGuess" type="text">
        <button id="submitBtn" type="submit">Submit</button>
    </article>
    <aside>
        <h1>ScoreBoard</h1>
        <p id="scoreBoard">Nothing yet</p>
    </aside>

  </body>
</html>
